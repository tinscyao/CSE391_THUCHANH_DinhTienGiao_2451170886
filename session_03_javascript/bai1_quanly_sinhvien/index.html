<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Quản Lý Sinh Viên</h1>

        <div class="stats">
            <div class="stat-item">
                <span>Tổng số sinh viên:</span>
                <span id="totalStudents">0</span>
            </div>
            <div class="stat-item">
                <span>Điểm trung bình lớp:</span>
                <span id="avgScore">0</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="moForm()">+ Thêm Sinh Viên</button>
        </div>

        <div id="thongbao" class="notification"></div>

        <table>
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và Tên</th>
                    <th>Ngày Sinh</th>
                    <th>Lớp</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="danhsach"></tbody>
        </table>

        <div id="popup" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="tieudeForm">Thêm Sinh Viên</h2>
                    <button onclick="dongForm()">&times;</button>
                </div>
                <form onsubmit="luuSinhVien(event)">
                    <div class="form-group">
                        <label>Mã sinh viên:</label>
                        <input type="text" id="maSV" required>
                    </div>
                    <div class="form-group">
                        <label>Họ và tên:</label>
                        <input type="text" id="hoTen" required>
                    </div>
                    <div class="form-group">
                        <label>Ngày sinh:</label>
                        <input type="date" id="ngaySinh" required>
                    </div>
                    <div class="form-group">
                        <label>Lớp:</label>
                        <input type="text" id="lop" required>
                    </div>
                    <div class="form-group">
                        <label>Điểm trung bình:</label>
                        <input type="number" id="diem" min="0" max="10" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Lưu</button>
                        <button type="button" onclick="dongForm()">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
